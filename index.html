    <!-- CAROUSEL: Flickity JavaScript Setup utilising Jquery -->
    <script>
        var $carousel = $('.main-carousel').flickity({
            cellSelector: 'img',
            imagesLoaded: true,
            draggable: true,
            pageDots: false,
            wrapAround: true,
            percentPosition: false,
            cellAlign: 'left',
            contain: true
        });
        var $caption = $('.caption');
        // Flickity instance of each image caption
        var flkty = $carousel.data('flickity');

        $carousel.on('select.flickity', function () {
            // set image caption using img's alt text
            $caption.text(flkty.selectedElement.alt)
        });
    </script>

   <!-- JavaScript for the MOBILE NAV MENU -->
    <script>
        function toggleMenu() {
            const nav = document.getElementById("myTopnav");
            const icon = document.getElementById("menuIcon");
            const btn = document.getElementById("menuToggle");

            const isOpen = nav.classList.toggle("responsive");
            icon.textContent = isOpen ? "close" : "menu";
            btn.setAttribute("aria-expanded", isOpen);
        }
    </script>
